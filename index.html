<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калории</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--gl-bg:linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,255,255,.34) 55%,rgba(255,255,255,.6));--gl-bd:rgba(255,255,255,.95);--gl-in:rgba(0,0,0,.06);--gl-sh:0 10px 30px rgba(60,60,90,.22);--bg:#f2f2f7;--surface:#fff;--text:#1d1d1f;--sub:#86868b;--line:rgba(60,60,67,.14);--track:rgba(120,120,128,.16);--seg:#fff;--glass:rgba(255,255,255,.72);--k:#ff2d55;--p:#30d158;--f:#ffd60a;--c:#0a84ff;--warn:#ff9f0a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl-bg:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.06) 55%,rgba(255,255,255,.16));--gl-bd:rgba(255,255,255,.3);--gl-in:rgba(255,255,255,.1);--gl-sh:0 10px 30px rgba(0,0,0,.5);--bg:#000;--surface:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:rgba(84,84,88,.55);--track:rgba(120,120,128,.32);--seg:#636366;--glass:rgba(44,44,46,.72);color-scheme:dark}}
:root[data-theme="dark"]{--gl-bg:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.06) 55%,rgba(255,255,255,.16));--gl-bd:rgba(255,255,255,.3);--gl-in:rgba(255,255,255,.1);--gl-sh:0 10px 30px rgba(0,0,0,.5);--bg:#000;--surface:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:rgba(84,84,88,.55);--track:rgba(120,120,128,.32);--seg:#636366;--glass:rgba(44,44,46,.72);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(70% 34% at 12% 100%,var(--glow1),transparent 70%),radial-gradient(70% 34% at 88% 100%,var(--glow2),transparent 70%),var(--bg);color:var(--text);font:17px/1.35 var(--ui);font-optical-sizing:auto;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:2px}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{display:flex;flex-direction:column}
#scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
main{max-width:460px;margin:0 auto;padding:14px 20px 34px}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.date{font-size:15px;font-weight:600;color:var(--sub)}
h1{margin:2px 0 0;font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.035em;text-transform:capitalize}
.nav{display:flex;gap:6px}
.nav button{width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:22px 0 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:500}
.dc{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--text);background:conic-gradient(var(--k) var(--pc,0%),var(--track) 0)}
.dc::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.dc>span{position:relative;z-index:1}
.wd.on{color:var(--text)}
.wd.on .dc::after{background:var(--text)}
.wd.on .dc>span{color:var(--bg)}
.sub{color:var(--sub);font-size:15px}
.hero{background:var(--surface);border-radius:30px;padding:24px 22px 22px}
.lbl{font-size:15px;font-weight:700;color:var(--k)}
.big{font-size:clamp(50px,8.4vh,68px);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.u{font-size:22px;font-weight:700;color:var(--sub);letter-spacing:-.01em}
.over .lbl,.over .big{color:var(--warn)}
.rings{width:min(250px,31vh);height:min(250px,31vh);margin:22px auto 20px;display:block;overflow:visible}
.rings .t{fill:none;stroke-width:16;opacity:.22}
.rings .a{fill:none;stroke-width:16;stroke-linecap:round;transform:rotate(-90deg);transform-origin:120px 120px;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1),opacity .3s}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.lg>div{display:flex;gap:10px;align-items:center}
.lg i{width:10px;height:36px;border-radius:5px;flex:none}
.lg b{display:block;font-size:15px}
.lg span{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.mini{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.mini b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
#goalBtn{border-radius:8px;color:var(--sub);font-size:15px}
.mini>span{color:var(--sub);font-size:15px}
.grp{margin-top:26px}
.gh{display:flex;justify-content:space-between;margin:0 6px 8px;font-size:15px;font-weight:600;color:var(--sub)}
.box{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 8px 13px 16px}
.row+.row{border-top:1px solid var(--line)}
.row>div{flex:1;min-width:0}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc{font-size:13px;color:var(--sub)}
.kc{font-weight:600;font-variant-numeric:tabular-nums}
.del{width:44px;height:44px;margin:-6px 0;border-radius:50%;color:var(--sub);font-size:20px}
.empty{text-align:center;color:var(--sub);padding:26px 24px;margin-top:22px;background:var(--surface);border-radius:20px}
:root{--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","SF Pro",Inter,system-ui,"Helvetica Neue",Arial,sans-serif;--lens:blur(0px);--gl-tint:rgba(255,255,255,.3);--tip:rgba(255,255,255,.72);--gl-r1:rgba(255,255,255,.95);--gl-r2:rgba(255,255,255,.6);--gl-glow:rgba(255,255,255,.35);--gl-shd:0 8px 28px rgba(60,60,100,.22);--glow1:rgba(10,132,255,.16);--glow2:rgba(255,45,85,.14);--sheet:rgba(255,255,255,.86)}
:root[data-theme="dark"]{--gl-tint:rgba(70,70,76,.34);--tip:rgba(36,36,40,.66);--gl-r1:rgba(255,255,255,.62);--gl-r2:rgba(255,255,255,.2);--gl-glow:rgba(255,255,255,.07);--gl-shd:0 10px 30px rgba(0,0,0,.55);--glow1:rgba(10,132,255,.3);--glow2:rgba(255,45,85,.28);--sheet:rgba(28,28,30,.84)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl-tint:rgba(70,70,76,.34);--tip:rgba(36,36,40,.66);--gl-r1:rgba(255,255,255,.62);--gl-r2:rgba(255,255,255,.2);--gl-glow:rgba(255,255,255,.07);--gl-shd:0 10px 30px rgba(0,0,0,.55);--glow1:rgba(10,132,255,.3);--glow2:rgba(255,45,85,.28);--sheet:rgba(28,28,30,.84)}}
.glass{position:relative;isolation:isolate;overflow:hidden;background:var(--gl-tint);-webkit-backdrop-filter:blur(8px) saturate(190%) brightness(1.1);backdrop-filter:blur(8px) saturate(190%) brightness(1.1);box-shadow:inset 1.5px 1.5px 1px -.5px var(--gl-r1),inset -1.5px -1.5px 1px -.5px var(--gl-r2),inset 0 0 20px var(--gl-glow),var(--gl-shd);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
html.lens .glass{-webkit-backdrop-filter:var(--lens) blur(2px) saturate(190%) brightness(1.1);backdrop-filter:var(--lens) blur(2px) saturate(190%) brightness(1.1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(120% 100% at var(--mx,25%) var(--my,-10%),rgba(255,255,255,.42),transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:.8;background:conic-gradient(from 200deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 22%,rgba(255,255,255,.6) 50%,rgba(255,255,255,.08) 72%,rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass:active{transform:scale(.93)}
#dock{flex:none;display:flex;justify-content:center;gap:12px;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px))}
#fab{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:58px;padding:0 26px;border-radius:29px;font-weight:600;font-size:17px;line-height:1;white-space:nowrap}
#fab .pl{width:22px;height:22px;flex:none;fill:none;stroke:var(--k);stroke-width:2.8;stroke-linecap:round}
#fab span{display:block;line-height:1;padding-bottom:1px}
#fab i{font-style:normal;color:var(--k);font-size:24px;margin-right:8px;vertical-align:-2px}
#thm{display:grid;place-items:center;padding:0;width:58px;height:58px;border-radius:50%;flex:none}
#thm svg{grid-area:1/1;width:26px;height:26px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.i-moon{translate:.7px -.7px}
:root[data-theme="dark"] .i-moon{opacity:0;transform:rotate(-90deg) scale(.3)}
:root[data-theme="light"] .i-sun{opacity:0;transform:rotate(90deg) scale(.3)}
.nav button.glass{width:44px;height:44px;display:grid;place-items:center;padding:0}
.nav svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#tip{position:fixed;z-index:8;width:max-content;max-width:272px;padding:13px 15px;border-radius:22px;background:var(--tip);font-size:14px;line-height:1.4;pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .18s,transform .3s cubic-bezier(.3,1.4,.5,1)}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-size:16px;margin-bottom:3px}
#tip .row2{display:flex;justify-content:space-between;gap:18px;font-variant-numeric:tabular-nums}
#tip .mut{color:var(--sub)}
.lgi{display:flex;gap:10px;align-items:center;text-align:left;border-radius:14px;padding:6px;margin:-6px;transition:background .2s}
.lgi:hover,.lgi:focus-visible{background:var(--track)}
.sheet .box,.sheet .hero{background:var(--bg)}
.warn{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:rgba(255,159,10,.15);border:1px solid rgba(255,159,10,.4);color:var(--warn);font-size:14px;line-height:1.4}
.stk{position:sticky;top:4px;z-index:3;display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding:10px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.28)}
.stk span{color:var(--sub);font-size:15px}
.stk b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--k)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:460px;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--gl-r2);border-radius:32px 32px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto;animation:up .3s cubic-bezier(.3,.8,.3,1)}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 14px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.025em}
.link{color:var(--c)}
.seg{display:flex;background:var(--track);border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:14px}
.seg .on{background:var(--seg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:0 20px;scrollbar-width:none}
.chips button{flex:none;padding:8px 14px;border-radius:999px;background:var(--track);font-size:15px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--track);border:0;border-radius:14px;padding:14px;margin-bottom:10px;resize:none;display:block}
input::placeholder,textarea::placeholder{color:var(--sub)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.err{min-height:20px;margin:0 0 6px;color:var(--k);font-size:14px}
.primary{width:100%;padding:15px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600}
.primary:disabled{opacity:.5}
.res{margin:14px 0}
.res .box{background:var(--bg)}
.tot{display:flex;justify-content:space-between;padding:12px 6px 0;font-weight:700}
.note{font-size:13px;color:var(--sub);margin:6px 6px 14px}
.fl{display:block;margin:0 4px 6px;font-size:13px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.found{max-height:340px;overflow:auto;margin:0 -4px}
.fd{display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}
.fd span:first-child{min-width:0}
.fd .sub{flex:none;font-variant-numeric:tabular-nums}
.pk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.pk-h b{font-size:22px;letter-spacing:-.02em}
.gram{display:flex;align-items:center;gap:12px;margin:16px 0 12px}
.gram input{margin:0;font-size:28px;font-weight:700;width:150px}
.res2{margin:4px 0 18px}
.big2{font-size:56px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--k);line-height:1}
.tabs{margin:18px 0 0}
#norm{margin-top:18px}
#norm .gh{margin-top:22px}
.nrow{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 16px;min-height:52px}
.nrow+.nrow{border-top:1px solid var(--line)}
.nrow input{margin:0;width:120px;text-align:right;background:transparent;padding:10px 12px}
.nrow .seg{margin:0;width:190px}
.arow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;text-align:left}
.arow+.arow{border-top:1px solid var(--line)}
.arow b{display:block;font-weight:600}
.arow i{font-style:normal;color:var(--k);font-weight:700;opacity:0}
.arow.on i{opacity:1}
.nrm{margin-top:20px}
.nrm .sub{margin:10px 0 0}

.th{flex:none;width:40px;height:40px;border-radius:10px;background:var(--track);display:grid;place-items:center;font-size:22px;line-height:1;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.lg{width:56px;height:56px;border-radius:14px;font-size:30px}
.fd .fn{flex:1;min-width:0}
.pk-h .pn{display:flex;gap:12px;align-items:center;min-width:0}
.cam{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:12px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;left:10%;right:10%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.3);pointer-events:none}
.bc{display:flex;gap:8px;margin-top:8px}
.bc input{flex:1;margin:0}
.bc .primary{width:auto;padding:0 22px}
#scanMsg{margin:0 4px 6px}
</style>
</head>
<body>
<div id="scroll"><main>
  <div class="top"><div><div class="date" id="dateLbl"></div><h1 id="title"></h1></div>
    <div class="nav"><button id="prev" class="glass" aria-label="Предыдущая неделя"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.25 5.5 8.75 12l6.5 6.5"/></svg></button><button id="next" class="glass" aria-label="Следующая неделя"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.75 5.5 15.25 12l-6.5 6.5"/></svg></button></div></div>
  <div id="diary">
  <div class="week" id="week"></div>
  <section class="hero" id="hero">
    <div class="lbl" id="leftLbl">Осталось</div>
    <div><span class="big" id="left">0</span><span class="u"> ккал</span></div>
    <svg class="rings" id="rings" viewBox="0 0 240 240" role="img" aria-label="Кольца: калории, белки, жиры, углеводы"></svg>
    <div class="lg" id="lg"></div>
    <div class="mini"><span>Съедено <b id="eaten">0</b></span><button id="goalBtn" aria-label="Настройки и цель">Цель <b id="goal">2200</b> ›</button></div>
  </section>
  <section id="list"></section>
  </div>
  
</main></div>
<div id="dock">
  <button id="fab" class="glass"><svg class="pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Добавить еду</span></button>
  <button id="thm" class="glass" aria-label="Сменить тему: светлая или тёмная">
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.6A8.5 8.5 0 1 1 10.4 3.5a6.8 6.8 0 0 0 10.1 10.1z"/></svg>
  </button>
</div>

<div class="ov" id="ov" hidden>
  <div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="t1" hidden>
    <div class="shh"><h2 id="t1">Добавить еду</h2><button class="link" data-close>Отмена</button></div>
    <div class="seg" id="mode"></div>
    <div class="seg" id="seg"></div>
    <div id="srPane">
      <input id="q" type="search" placeholder="Найти продукт: гречка, борщ, банан" autocomplete="off">
      <div class="found" id="found"></div>
      <div id="pick" hidden>
        <div class="pk-h"><span class="pn"><span id="pkTh"></span><b id="pkName"></b></span><button class="link" id="pkBack">Назад</button></div>
        <div class="sub" id="pkBase"></div>
        <div class="gram"><input id="gr" inputmode="decimal" aria-label="Граммы"><span class="sub">грамм</span></div>
        <div class="chips" id="gchips"></div>
        <div class="res2"><span class="big2" id="pkK">0</span><span class="u"> ккал</span><div class="sub" id="pkM"></div></div>
        <button class="primary" id="addSr">Добавить</button>
      </div>
    </div>
    <div id="scanPane" hidden>
      <div class="cam"><video id="cam" playsinline muted></video><div class="frame"></div></div>
      <p class="sub" id="scanMsg">Наведите камеру на штрих-код</p>
      <button class="link" id="scanAgain" hidden style="padding:4px;margin:0 0 6px">Сканировать снова</button>
      <div class="bc"><input id="bcIn" inputmode="numeric" placeholder="Или введите код цифрами" autocomplete="off"><button class="primary" id="bcGo">Найти</button></div>
    </div>
    <div id="manPane" hidden>
      <div class="chips" id="chips"></div>
      <input id="nm" placeholder="Название" autocomplete="off">
      <input id="kc" placeholder="Калории, ккал" inputmode="numeric" autocomplete="off">
      <div class="three"><input id="p" placeholder="Белки, г" inputmode="decimal"><input id="f" placeholder="Жиры, г" inputmode="decimal"><input id="c" placeholder="Углеводы, г" inputmode="decimal"></div>
      <p class="err" id="err" role="alert"></p>
      <button class="primary" id="addBtn">Добавить</button>
    </div>
  </div>
  <div class="sheet" id="goalSheet" role="dialog" aria-modal="true" aria-labelledby="t2" hidden>
    <div class="shh"><h2 id="t2">Цель на день</h2><button class="link" data-close>Отмена</button></div>
    <label class="fl" for="gi">Калории в день, ккал</label>
    <input id="gi" inputmode="numeric">
    <p class="err" id="gerr" role="alert"></p>

const RINGS = [['k',112],['p',90],['f',68],['c',46]];

const key = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => Math.max(0, Math.round(parseFloat(String(v).replace(',', '.')) || 0));
const fmt = n => n.toLocaleString('ru-RU');
const todayKey = () => key(new Date());
let day = new Date(), meal = 'Обед', mode = 'man', sample = null, pending = [], weekStart = new Date(), shown = 0;

$('#rings').innerHTML = RINGS.map(([id, r]) => { const L = 2 * Math.PI * r;
  return `<circle class="t" cx="120" cy="120" r="${r}" stroke="var(--${id})"/><circle class="a" id="r${id}" cx="120" cy="120" r="${r}" stroke="var(--${id})" stroke-dasharray="${L}" stroke-dashoffset="${L}" style="opacity:0;filter:drop-shadow(0 0 5px var(--${id}))"/>`; }).join('');
function setRing(id, r, pct, has) {
  const L = 2 * Math.PI * r, el = $('#r' + id);
  el.style.strokeDashoffset = L * (1 - Math.min(pct, 1)); el.style.opacity = has ? 1 : 0;
}
function tween(el, to) {
  const from = shown; shown = to;
  if (from === to || matchMedia('(prefers-reduced-motion:reduce)').matches) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  (function s(t) { const k = Math.min((t - t0) / 700, 1), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(s); })(t0);
}

function render() {
  const k = key(day), list = st.days[k] || [], g = st.goal;
  const sum = f => Math.round(list.reduce((a, e) => a + (e[f] || 0), 0));
  const eaten = sum('kcal'), left = g - eaten;
  $('#title').textContent = k === todayKey() ? 'Сегодня' : day.toLocaleDateString('ru-RU', {weekday:'long'});
  $('#dateLbl').textContent = day.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  $('#hero').classList.toggle('over', left < 0);
  $('#leftLbl').textContent = left >= 0 ? 'Осталось' : 'Сверх цели';
  tween($('#left'), Math.abs(left));
  $('#eaten').textContent = fmt(eaten);
  $('#goal').textContent = fmt(g);
  const mg = st.mac || {p: g*.25/4, f: g*.3/9, c: g*.45/4};
  const M = [['p','Белки',mg.p],['f','Жиры',mg.f],['c','Углеводы',mg.c]];
  snap = {k:[eaten,g],p:[sum('p'),mg.p],f:[sum('f'),mg.f],c:[sum('c'),mg.c]};
  setRing('k', 112, eaten / g, eaten > 0);
  M.forEach(([id, , goal], i) => setRing(id, RINGS[i + 1][1], sum(id) / goal, sum(id) > 0));
  $('#lg').innerHTML = [['k','Калории, ккал',eaten,g,'']].concat(M.map(([id, n, goal]) => [id, n, sum(id), Math.round(goal), 'г']))
    .map(([id, n, v, goal, u]) => `<button class="lgi" data-t="${id}"><i style="background:var(--${id})"></i><div><b>${n}</b><span>${fmt(v)} из ${fmt(goal)} ${u}</span></div></button>`).join('');
  weekStart = new Date(day); weekStart.setDate(day.getDate() - (day.getDay() + 6) % 7);
  $('#week').innerHTML = WD.map((w, i) => {
    const dt = new Date(weekStart); dt.setDate(weekStart.getDate() + i);
    const kk = (st.days[key(dt)] || []).reduce((a, e) => a + e.kcal, 0);
    return `<button class="wd ${key(dt) === k ? 'on' : ''}" data-i="${i}" aria-label="${dt.toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'})}"><span>${w}</span><span class="dc" style="--pc:${Math.min(kk / g * 100, 100)}%"><span>${dt.getDate()}</span></span></button>`;
  }).join('');
  let h = '';
  MEALS.forEach(m => {
    const it = list.filter(e => e.meal === m);
    if (!it.length) return;
    h += `<div class="grp"><div class="gh"><span>${m}</span><span>${fmt(it.reduce((a, e) => a + e.kcal, 0))} ккал</span></div><div class="box">` +
      it.map(e => `<div class="row">${thumb(e.img, e.name)}<div><div class="nm">${esc(e.name)}</div>${(e.p||e.f||e.c) ? `<div class="mc">белки ${e.p}, жиры ${e.f}, углеводы ${e.c} г</div>` : ''}</div><span class="kc">${e.kcal}</span><button class="del" data-id="${e.id}" aria-label="Удалить ${esc(e.name)}">×</button></div>`).join('') + '</div></div>';
  });
  $('#list').innerHTML = h || '<div class="empty">В этот день пока ничего нет. Нажмите «Добавить еду» и найдите продукт в базе.</div>';
}

async function lookupBarcode(code) {

  const r = btn.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(12, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 12)) + 'px';
  tip.style.top = (r.top - th - 12 < 12 ? r.bottom + 12 : r.top - th - 12) + 'px';
  tip.classList.add('on'); tipFor = btn; lens(tip);
}
const hideTip = () => { tip.classList.remove('on'); tipFor = null; };
const lgEl = $('#lg');
lgEl.addEventListener('mouseover', e => { const b = e.target.closest('.lgi'); if (b && b !== tipFor && canHover()) showTip(b); });
lgEl.addEventListener('mouseout', e => { const b = e.target.closest('.lgi'); if (b && !b.contains(e.relatedTarget)) hideTip(); });
lgEl.addEventListener('focusin', e => { const b = e.target.closest('.lgi'); if (b && b.matches(':focus-visible')) showTip(b); });
lgEl.addEventListener('focusout', hideTip);
lgEl.addEventListener('click', e => { const b = e.target.closest('.lgi'); if (b) (tipFor === b && !canHover()) ? hideTip() : showTip(b); });
document.addEventListener('click', e => { if (!e.target.closest('.lgi')) hideTip(); });
$('#scroll').addEventListener('scroll', hideTip, {passive: true});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
// ----- theme button + glass init
$('#thm').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = st.theme = t; save();
};
document.querySelectorAll('.glass').forEach(el => { lens(el); if (window.ResizeObserver) new ResizeObserver(() => lens(el)).observe(el); });
document.addEventListener('pointermove', e => {
  const g = e.target.closest && e.target.closest('.glass'); if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%'); g.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
});

render();
// ----- fonts load after the first paint so they can never delay the app
(function () {
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap';
  document.head.appendChild(l);
})();
// ----- keep "today" selected: if the page stays open past midnight or is restored from the back/forward cache
let lastToday = todayKey();
function syncToday() {
  const t = todayKey();
  if (t === lastToday) return;
  if (key(day) === lastToday) day = new Date();
  lastToday = t; render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncToday(); });
window.addEventListener('pageshow', syncToday);
setInterval(syncToday, 60000);
</script>
